# Yoda Server — 本地/内网快速部署
#
# 用法：
#   docker compose -f apps/server/docker-compose.yml up -d
# 然后客户端连接 http://localhost:8787
#
# 生产环境务必设置 YODA_SERVER_JWT_SECRET 为强随机值。

services:
  yoda-server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: yoda-server
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      YODA_SERVER_DB: /data/yoda-server.db
      YODA_SERVER_SKILLS_DIR: /data/skills
      YODA_SERVER_JWT_SECRET: ${YODA_SERVER_JWT_SECRET:-change-me-in-production}
    volumes:
      - yoda-server-data:/data
    restart: unless-stopped

volumes:
  yoda-server-data:
