# GitHub Actions: 自动打包分发
#
# 触发条件：推送 v* tag（如 v0.4.0）
# 构建 macOS 和 Windows 产物并发布到 GitHub Releases
#
# 所需 GitHub Secrets（macOS 签名/公证，可选）:
# - MAC_CERTS: Base64 编码的 macOS Developer ID Application 证书 (.p12)
# - MAC_CERTS_PASSWORD: 证书密码
# - APPLE_ID: Apple ID（公证用）
# - APPLE_APP_SPECIFIC_PASSWORD: App-Specific 密码（公证用）
# - APPLE_TEAM_ID: Apple Developer Team ID
# GITHUB_TOKEN 由 GitHub Actions 自动提供，无需手动配置

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（默认使用最新推送的 v* tag；tag 推送偶发不触发时手动补跑）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  validate-release-version:
    name: validate release version
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # workflow_dispatch 时检出入参指定的 tag；push 触发时自动检出 tag
          ref: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}

      - name: 校验 tag 与应用版本一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            # workflow_dispatch 手动补跑：以输入 tag 为准（注意需在触发前确认该 tag 已推送）
            tag="${{ github.event.inputs.tag }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "发布 tag 必须是 vX.Y.Z 格式，实际为：$tag" >&2
            exit 1
          fi

          app_version="$(node -p "require('./apps/electron/package.json').version")"
          if [[ "${tag#v}" != "$app_version" ]]; then
            echo "发布 tag 与 apps/electron/package.json 版本不一致：tag=$tag，app=$app_version" >&2
            exit 1
          fi

          echo "发布版本校验通过：$tag"

      # 预创建 GitHub Release 并写入发布说明；后续各平台 job 的 electron-builder
      # --publish always 会复用该 Release 并上传各自产物（多平台并行上传自动合并）。
      - name: 创建/复用 GitHub Release（含发布说明）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，跳过创建"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "LuxCoder ${GITHUB_REF_NAME}" \
              --notes-file apps/electron/RELEASE_NOTES.md
            echo "已创建 Release ${GITHUB_REF_NAME}"
          fi

  build-mac-arm64:
    name: build (macos-latest, mac, arm64, --arm64)
    runs-on: macos-latest
    needs: validate-release-version
    env:
      MAC_CERTS: ${{ secrets.MAC_CERTS }}
      MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 有签名证书时导入；无证书（内部构建）时跳过，产出未签名包
      - name: 导入 macOS 签名证书
        if: env.MAC_CERTS != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm $RUNNER_TEMP/cert.p12

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 打包并发布 (macOS arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MAC_CERTS != '' }}
        run: |
          for i in 1 2 3; do
            npx electron-builder --mac --arm64 --publish always && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
        working-directory: apps/electron

  # GitHub 已淘汰 Intel macOS runner（macos-13），x64 构建改为在 macos-latest（arm64）上交叉构建：
  # 显式下载 darwin-x64 SDK 子包（bun install 会按 os/cpu 过滤掉它），再 electron-builder --x64 产出 x64 DMG/ZIP。
  build-mac-x64:
    name: build (macos-latest, mac, x64, --x64)
    runs-on: macos-latest
    needs: validate-release-version
    env:
      MAC_CERTS: ${{ secrets.MAC_CERTS }}
      MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # macos-latest 是 arm64 runner，bun install 按 os/cpu 只装 darwin-arm64 子包。
      # x64 交叉打包需要 darwin-x64 子包（含 Intel claude binary），显式从 npm registry 下载解压
      # 到 apps/electron/node_modules（electron-builder files 规则已包含该目录）。版本从
      # apps/electron/package.json optionalDependencies 读取，避免与 lockfile 漂移。
      - name: 安装 Intel 版 Claude SDK 子包
        run: |
          set -euo pipefail
          SDK_X64_VERSION="$(node -p "require('./apps/electron/package.json').optionalDependencies['@anthropic-ai/claude-agent-sdk-darwin-x64']")"
          mkdir -p apps/electron/node_modules/@anthropic-ai
          curl -fsSL "https://registry.npmjs.org/@anthropic-ai/claude-agent-sdk-darwin-x64/-/claude-agent-sdk-darwin-x64-${SDK_X64_VERSION}.tgz" -o /tmp/sdk-x64.tgz
          tar -xzf /tmp/sdk-x64.tgz -C apps/electron/node_modules/@anthropic-ai
          mv apps/electron/node_modules/@anthropic-ai/package apps/electron/node_modules/@anthropic-ai/claude-agent-sdk-darwin-x64
          rm -f /tmp/sdk-x64.tgz
          test -x "apps/electron/node_modules/@anthropic-ai/claude-agent-sdk-darwin-x64/claude" && echo "Intel 版 Claude SDK 子包就绪: v${SDK_X64_VERSION}"

      # 有签名证书时导入；无证书（内部构建）时跳过，产出未签名包
      - name: 导入 macOS 签名证书
        if: env.MAC_CERTS != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm $RUNNER_TEMP/cert.p12

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 打包并发布 (macOS x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MAC_CERTS != '' }}
        run: |
          for i in 1 2 3; do
            npx electron-builder --mac --x64 --publish always && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
        working-directory: apps/electron

  build-linux:
    name: build (ubuntu-latest, linux, x64)
    runs-on: ubuntu-latest
    needs: validate-release-version

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 打包并发布 (Linux/Ubuntu)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish always
        working-directory: apps/electron

  build-windows-x64:
    name: build (windows-latest, win, x64, --x64)
    runs-on: windows-latest
    needs: validate-release-version

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 构建应用
      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 打包并发布 (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
        working-directory: apps/electron
